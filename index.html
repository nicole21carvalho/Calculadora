<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Calculadora web feita com HTML, CSS e JavaScript puro.">
  <title>Calculadora · Nicole R. de Carvalho</title>
  <link rel="icon" href="calculadora.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="pagina">
    <section class="calculadora" aria-label="Calculadora">
      <header class="cabecalho">
        <h1>Calculadora <span aria-hidden="true">✨</span></h1>
      </header>

      <output class="tela" aria-live="polite">
        <span id="expressao" class="tela__expressao">0</span>
        <span id="resultado" class="tela__resultado"></span>
      </output>

      <div class="teclado">
        <button class="tecla tecla--funcao" data-acao="limpar" aria-label="Limpar">C</button>
        <button class="tecla tecla--funcao" data-acao="apagar" aria-label="Apagar último dígito">⌫</button>
        <button class="tecla tecla--operador" data-valor="/" aria-label="Dividir">÷</button>
        <button class="tecla tecla--operador" data-valor="*" aria-label="Multiplicar">×</button>

        <button class="tecla" data-valor="7">7</button>
        <button class="tecla" data-valor="8">8</button>
        <button class="tecla" data-valor="9">9</button>
        <button class="tecla tecla--operador" data-valor="-" aria-label="Subtrair">−</button>

        <button class="tecla" data-valor="4">4</button>
        <button class="tecla" data-valor="5">5</button>
        <button class="tecla" data-valor="6">6</button>
        <button class="tecla tecla--operador" data-valor="+" aria-label="Somar">+</button>

        <button class="tecla" data-valor="1">1</button>
        <button class="tecla" data-valor="2">2</button>
        <button class="tecla" data-valor="3">3</button>
        <button class="tecla tecla--igual" data-acao="calcular" aria-label="Calcular">=</button>

        <button class="tecla tecla--zero" data-valor="0">0</button>
        <button class="tecla" data-valor="." aria-label="Vírgula">,</button>
      </div>

      <p class="dica">Também funciona pelo teclado: números, + − × ÷, Enter, Backspace e Esc.</p>
    </section>

    <footer class="rodape">
      Feito por <a href="https://github.com/nicole21carvalho">Nicole R. de Carvalho</a>
    </footer>
  </main>

  <script src="calc.js"></script>
  <script src="script.js"></script>
</body>
</html>
